<div class="col-12 mt-2 width-1220">
  <div class="row">
    <div class="col-4">
      <button
        class="btn btn-primary btn-sm"
        type="button"
        (click)="addPerson()"
      >
        <fa-icon [icon]="faPlus"></fa-icon> Adaugă
      </button>
    </div>

    <div class="col-4">
      <h4 class="text-center">Persoane</h4>
    </div>

    <div class="col-4"></div>
  </div>

  <div class="row">
    <div class="col-12 width-1220">
      <app-data-table
        [rows]="persons"
        [columns]="columns"
        (editRow)="editPerson($event)"
        (deleteRow)="deletePerson($event)"
        emptyMessage="Nu există persoane de afișat."
      >
        <ng-template #filterTemplate>
          <th></th>

          <th>
            <input
              class="form-control input-xs"
              placeholder="Căutare..."
              aria-label="Căutare nume"
              [(ngModel)]="filters.lastName"
              (ngModelChange)="onFiltersChange()"
            />
          </th>

          <th>
            <input
              class="form-control input-xs"
              placeholder="Căutare..."
              aria-label="Căutare prenume"
              [(ngModel)]="filters.firstName"
              (ngModelChange)="onFiltersChange()"
            />
          </th>

          <th>
            <input
              class="form-control input-xs"
              placeholder="Căutare..."
              aria-label="Căutare CNP"
              [(ngModel)]="filters.cnp"
              (ngModelChange)="onFiltersChange()"
            />
          </th>

          <th>
            <input
              type="text"
              inputmode="numeric"
              maxlength="3"
              class="form-control input-xs"
              placeholder="Căutare..."
              aria-label="Căutare vârstă exactă"
              [(ngModel)]="filters.age"
              (ngModelChange)="onFiltersChange()"
            />
          </th>

          <th></th>
          <th></th>
          <th></th>
        </ng-template>

        <ng-template #customCell let-person>
          <div
            *ngFor="let car of person.cars; let last = last"
            [class.border-bottom]="!last"
            class="p-1"
          >
            <strong>{{ car.brand }} {{ car.model }}</strong>

            <div>
              An: {{ car.manufactureYear }} | Capacitate:
              {{ car.engineCapacity }} cm³ | Impozit: {{ car.tax }} lei
            </div>
          </div>

          <span *ngIf="!person.cars.length">—</span>
        </ng-template>
      </app-data-table>
    </div>
  </div>
</div>
