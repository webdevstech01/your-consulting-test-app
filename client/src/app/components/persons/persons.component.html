<div class="col-12 mt-2 width-1220">
  <div class="row">
    <div class="col-4">
      <button
        class="btn btn-primary btn-sm"
        type="button"
        (click)="addPerson()"
      >
        <fa-icon [icon]="faPlus"></fa-icon> Adaugă
      </button>
    </div>

    <div class="col-4">
      <h4 class="text-center">Persoane</h4>
    </div>

    <div class="col-4"></div>
  </div>

  <div class="row">
    <div class="col-12 width-1220">
      <table class="table table-striped table-hover">
        <thead>
          <tr class="table-bordered">
            <th width="60px">Nr. Crt.</th>
            <th width="180px">Nume</th>
            <th width="180px">Prenume</th>
            <th width="150px">CNP</th>
            <th width="70px">Vârsta</th>
            <th>Mașini în proprietate</th>
            <th width="70px"></th>
          </tr>
        </thead>
      </table>
    </div>

    <div class="col-12 position-relative width-1220">
      <div id="view" style="max-height: 60vh">
        <table
          class="table table-hover table-striped table-bordered font-14 p-0"
        >
          <tbody>
            <tr
              *ngFor="let person of persons; let i = index"
              (dblclick)="editPerson(person)"
            >
              <td width="60px" class="text-center">{{ i + 1 }}</td>
              <td width="180px">{{ person.lastName }}</td>
              <td width="180px">{{ person.firstName }}</td>
              <td width="150px" class="text-center">{{ person.cnp }}</td>
              <td width="70px" class="text-center">{{ person.age }}</td>

              <td>—</td>

              <td width="35px" class="text-center">
                <button
                  type="button"
                  class="btn btn-link p-0"
                  (click)="editPerson(person)"
                  aria-label="Modificare"
                >
                  <fa-icon class="text-primary" [icon]="faEdit"></fa-icon>
                </button>
              </td>

              <td width="35px" class="text-center">
                <button
                  type="button"
                  class="btn btn-link p-0"
                  disabled
                  aria-label="Ștergere"
                >
                  <fa-icon class="text-danger" [icon]="faTrashAlt"></fa-icon>
                </button>
              </td>
            </tr>

            <tr *ngIf="!persons.length" class="text-center fw-bold">
              <td colspan="8">Date inexistente!</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
